services:
  - type: web
    name: dic-mechanics-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python lab_server.py --host 0.0.0.0 --no-browser
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LAB_COOKIE_SECURE
        value: "1"
      - key: MPLBACKEND
        value: Agg
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
